<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Password Reset Confirmation</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #4CAF50; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; }
        .footer { background: #f4f4f4; padding: 10px; text-align: center; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Password Reset Successful</h1>
        </div>
        <div class="content">
            <p>Hello <strong>{{ name }}</strong>,</p>
            <p>Your password has been successfully reset at <strong>{{ timestamp }}</strong>.</p>
            <p>If you did not perform this action, please contact support immediately.</p>
            <p>Best regards,<br>Briolin Team</p>
        </div>
        <div class="footer">
            <p>&copy; 2026 Briolin. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
