services:
    caddy:
        image: caddy:2-alpine
        container_name: briolin-caddy
        ports:
            - "80:80"
        volumes:
            - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy-data:/data
            - caddy-config:/config
        depends_on:
            - frontend
            - api-gateway
        networks:
            - briolin-network
        restart: unless-stopped

    frontend:
        container_name: briolin-frontend
        build:
            context: ./frontend
            dockerfile: Dockerfile.local
        expose:
            - "5173"
        environment:
            VITE_API_BASE_URL: /api/v1
        volumes:
            - ./frontend:/app
            - /app/node_modules
        networks:
            - briolin-network
    # =========== INFRASTRUCTURE ===========
    keycloak-postgres:
        image: postgres:17-alpine
        container_name: keycloak-postgres
        environment:
            POSTGRES_USER: keycloak
            POSTGRES_PASSWORD: keycloak
            POSTGRES_DB: keycloak
        ports:
            - "5433:5432"
        volumes:
            - keycloak-postgres-data:/var/lib/postgresql/data
        networks:
            - briolin-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U keycloak"]
            interval: 10s
            timeout: 5s
            retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: keycloak
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    volumes:
      - ./backend/infrastructure/keycloak:/opt/keycloak/data/import
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    networks:
      - briolin-network
  
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: briolin-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BROWSER: "on"
      MINIO_UPDATE: "off"
    env_file:
      - backend/media-service/.env
    volumes:
      - minio-data:/data
    networks:
      - briolin-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s
    restart: unless-stopped

    redis:
        image: redis:7-alpine
        container_name: briolin-redis
        ports:
            - "6379:6379"
        volumes:
            - redis-data:/data
        command: redis-server --appendonly yes
        networks:
            - briolin-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

    redis-insight:
        image: redislabs/redisinsight:2.70
        container_name: briolin-redis-insight
        ports:
            - "5540:5540"
        volumes:
            - redis-insight-data:/db
        environment:
            - REDISINSIGHT_HOST=0.0.0.0
            - REDISINSIGHT_PORT=5540
            - REDISINSIGHT_DATA_DIR=/db
        depends_on:
            - redis
        networks:
            - briolin-network
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:5540/"]
            interval: 30s
            timeout: 10s
            retries: 3

  rabbitmq:
    image: rabbitmq:4.2.2-management-alpine
    container_name: briolin-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ__USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ__PASSWORD:-guest}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ__ERLANG__COOKIE:-erlang-cookie-super-strong}
    env_file:
      - backend/api-gateway/.env
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - briolin-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # =========== DATABASES ===========
  postgres-db:
    image: pgvector/pgvector:pg17
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "max_connections=400"]
    ports:
      - "5434:5432"
    volumes:
      - postgres-db-data:/var/lib/postgresql/data
      - ./backend/infrastructure/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    networks:
      - briolin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGPASS_FILE: /pgpass
      PGADMIN_DISABLE_POSTFIX: "1"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./backend/infrastructure/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./backend/infrastructure/pgadmin/pgpass:/pgpass:ro
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - briolin-network
    restart: unless-stopped

  mongo-db:
    image: mongo:8.0
    container_name: mongo-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-db-data:/data/db
    networks:
      - briolin-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/admin --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    
  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "8001:8001"
    env_file:
      - backend/auth-service/.env
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
    volumes:
      - ./backend/shared:/app/shared:ro
    networks:
      - briolin-network
    restart: unless-stopped

  user-service:
    build:
      context: ./backend
      dockerfile: user-service/Dockerfile
    container_name: user-service
    ports:
      - "8002:8002"
    env_file:
      - backend/user-service/.env
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
    volumes:
      - ./backend/shared:/app/shared:ro
    networks:
      - briolin-network
    restart: unless-stopped

  profile-service:
    build:
      context: ./backend
      dockerfile: profile-service/Dockerfile
    container_name: profile-service
    ports:
      - "8003:8003"
    env_file:
      - backend/profile-service/.env
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
    volumes:
      - ./backend/shared:/app/shared:ro
      - model-cache:/root/.cache
    networks:
      - briolin-network
    restart: unless-stopped

  testing-service:
    build:
      context: ./backend
      dockerfile: testing-service/Dockerfile
    container_name: testing-service
    ports:
      - "8004:8004"
    env_file:
      - backend/testing-service/.env
    depends_on:
      postgres-db:
        condition: service_healthy
      mongo-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/shared:/app/shared:ro
    networks:
      - briolin-network
    restart: unless-stopped

  chat-service:
    build:
      context: ./backend
      dockerfile: chat-service/Dockerfile
    container_name: chat-service
    ports:
      - "8005:8005"
    env_file:
      - backend/chat-service/.env
    depends_on:
      postgres-db:
        condition: service_healthy
      mongo-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/shared:/app/shared:ro
    networks:
      - briolin-network
    restart: unless-stopped

  matching-service:
    build:
      context: ./backend
      dockerfile: matching-service/Dockerfile
    container_name: matching-service
    ports:
      - "8006:8006"
    env_file:
      - backend/matching-service/.env
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      profile-service:
        condition: service_started
    volumes:
      - ./backend/shared:/app/shared:ro
    networks:
      - briolin-network
    restart: unless-stopped
  
  media-service:
    build:
      context: ./backend
      dockerfile: media-service/Dockerfile
    container_name: media-service
    ports:
      - "8007:8007"
    env_file:
      - backend/media-service/.env
    depends_on:
      postgres-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/shared:/app/shared:ro
    networks:
      - briolin-network
    restart: unless-stopped

  email-service:
    build:
      context: ./backend
      dockerfile: email-service/Dockerfile
    container_name: email-service
    ports:
      - "8008:8008"
    env_file:
      - backend/email-service/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backend/shared:/app/shared:ro
    networks:
      - briolin-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8000:8000"
    env_file:
      - backend/api-gateway/.env
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      profile-service:
        condition: service_started
      testing-service:
        condition: service_started
      chat-service:
        condition: service_started
      media-service:
        condition: service_started
      matching-service:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./backend/shared:/app/shared:ro
    networks:
      - briolin-network
    restart: unless-stopped

  init-superadmin:
    build:
      context: ./backend
      dockerfile: scripts/Dockerfile.init
    container_name: briolin-init-superadmin
    env_file:
      - backend/scripts/.env
    environment:
      - SUPERADMIN_EMAIL=${SUPERADMIN_EMAIL}
      - SUPERADMIN_USERNAME=${SUPERADMIN_USERNAME}
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD}
    networks:
      - briolin-network
    profiles:
      - init

volumes:
    caddy-data:
    caddy-config:
    postgres-db-data:
  mongo-db-data:
  pgadmin-data:
  keycloak-postgres-data:
    keycloak-data:
    redis-data:
    redis-insight-data:
    rabbitmq-data:
    minio-data:
        driver: local
    model-cache:
    auth-postgres-data:
    user-postgres-data:
    profile-postgres-data:
    testing-postgres-data:
    chat-postgres-data:
    matching-postgres-data:
    media-postgres-data:

networks:
    briolin-network:
        driver: bridge
