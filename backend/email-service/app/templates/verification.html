<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Email Verification Code</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #FF9800; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; }
        .code { background: #f4f4f4; padding: 15px; font-size: 32px; font-weight: bold; text-align: center; letter-spacing: 5px; font-family: monospace; }
        .footer { background: #f4f4f4; padding: 10px; text-align: center; font-size: 12px; color: #666; }
        .warning { color: #f44336; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Email Verification</h1>
        </div>
        <div class="content">
            <p>Hello <strong>{{ name }}</strong>,</p>
            <p>Please use the following verification code to complete your registration:</p>
            <div class="code">{{ code }}</div>
            <p>This code expires in <strong>15 minutes</strong>.</p>
            <p class="warning">If you didn't request this, please ignore this email.</p>
            <p>Best regards,<br>Briolin Team</p>
        </div>
        <div class="footer">
            <p>&copy; 2026 Briolin. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
